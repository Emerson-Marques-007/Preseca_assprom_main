<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Presença Digital - Marque sua presença de forma rápida e segura">
  <meta name="theme-color" content="#3D5A99">
  <title>ASSPROM | Presença Digital — Acesso</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233D5A99'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='white'>✓</text></svg>">
</head>
<body>
  <!-- Loading inicial -->
  <div class="loading-overlay" id="loading-initial">
    <div class="spinner"></div>
    <p class="text-secondary">Carregando...</p>
  </div>

  <div class="auth-page" id="auth-page" style="display:none;">
    <div class="main-content">
      <header class="aluno-header" style="background:#fff;border-bottom:1px solid #eee;padding:1.5rem 0 1rem 0;text-align:center;position:relative;">
        <h1 style="font-size:2rem;font-weight:700;color:#3D5A99;margin:0;">Painel do Aluno</h1>
        <p style="font-size:1.1rem;color:#555;margin-top:0.5rem;">Acompanhe suas presenças, aulas e histórico</p>
        <button class="btn btn-ghost btn-icon" onclick="Auth.logout()" title="Sair" aria-label="Sair" style="position:absolute;top:1.5rem;right:1.5rem;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </header>
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            Cadastrar
          </button>
        </div>
        <div class="tabs-indicator"></div>
      </div>

      <!-- Formulário Login -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-matricula">Matrícula</label>
          <div class="input-wrapper">
            <span class="input-icon-start" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
            </span>
            <input class="form-input has-icon-start" type="text" id="login-matricula" placeholder="Ex: 2024001" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-senha">Senha</label>
          <div class="input-wrapper">
            <span class="input-icon-start" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input class="form-input has-icon-start has-icon-end" type="password" id="login-senha" placeholder="Sua senha" required minlength="6" autocomplete="current-password">
            <span class="input-icon-end">
              <button type="button" class="btn-password-toggle" onclick="toggleSenha('login-senha', this)" aria-label="Mostrar ou ocultar senha">
                <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Entrar
        </button>
      </form>

      <!-- Formulário Cadastro -->
      <form id="form-cadastro" class="hidden" onsubmit="handleCadastro(event)">
        <!-- Seção: Informações Pessoais -->
        <div class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
          Dados Pessoais
        </div>

        <div class="form-group">
          <label class="form-label required" for="cad-nome">Nome Completo</label>
          <div class="input-wrapper">
            <span class="input-icon-start" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
            </span>
            <input class="form-input has-icon-start" type="text" id="cad-nome" placeholder="Seu nome completo" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label required" for="cad-matricula">Matrícula</label>
          <div class="input-wrapper">
            <span class="input-icon-start" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            </span>
            <input class="form-input has-icon-start" type="text" id="cad-matricula" placeholder="Sua matrícula" required autocomplete="off">
          </div>
        </div>

        <!-- Seção: Acesso -->
        <div class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Acesso
        </div>

        <div class="form-group">
          <label class="form-label required" for="cad-email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon-start" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input class="form-input has-icon-start" type="email" id="cad-email" placeholder="seu.email@exemplo.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-separator"></div>

        <div class="form-group">
          <label class="form-label required" for="cad-senha">Senha</label>
          <div class="input-wrapper">
            <span class="input-icon-start" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input class="form-input has-icon-start has-icon-end" type="password" id="cad-senha" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" oninput="atualizarForcaSenha(this.value)">
            <span class="input-icon-end">
              <button type="button" class="btn-password-toggle" onclick="toggleSenha('cad-senha', this)" aria-label="Mostrar ou ocultar senha">
                <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </span>
          </div>
          <div class="password-strength" id="senha-forca">
            <div class="password-strength-header">
              <span class="password-strength-label">Força da senha</span>
              <span class="password-strength-text" id="senha-forca-texto">—</span>
            </div>
            <div class="password-strength-bars">
              <div class="password-strength-bar" id="psbar-1"></div>
              <div class="password-strength-bar" id="psbar-2"></div>
              <div class="password-strength-bar" id="psbar-3"></div>
              <div class="password-strength-bar" id="psbar-4"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label required" for="cad-senha2">Confirmar Senha</label>
          <div class="input-wrapper">
            <span class="input-icon-start" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <input class="form-input has-icon-start has-icon-end" type="password" id="cad-senha2" placeholder="Repita a senha" required minlength="6" autocomplete="new-password" oninput="validarConfirmacaoSenha()">
            <span class="input-icon-end" id="cad-senha2-icon"></span>
          </div>
          <div class="confirm-senha-feedback" id="cad-senha2-feedback">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="cad-senha2-feedback-icon"></svg>
            <span id="cad-senha2-feedback-texto"></span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-cadastro">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Criar Conta
        </button>
      </form>

      <div class="auth-divider">ou</div>

      <p class="text-center text-sm text-secondary">
        Escaneie o QR Code na sala de aula para marcar presença automaticamente
      </p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // --- Verificar se já está logado ---
    async function init() {
      try {
        const session = await Auth.getSession();
        if (session) {
          const perfil = await Auth.getPerfil();
          if (perfil) {
            if (perfil.role === 'professor') {
              Utils.redirect('professor/index.html');
            } else {
              Utils.redirect('aluno/index.html');
            }
            return;
          }
        }
      } catch (e) {
        console.error(e);
      }
      // Mostrar página de auth
      document.getElementById('loading-initial').style.display = 'none';
      document.getElementById('auth-page').style.display = '';
    }

    init();

    // --- Tabs ---
    function showTab(tab) {
      const loginForm = document.getElementById('form-login');
      const cadastroForm = document.getElementById('form-cadastro');
      const tabLogin = document.getElementById('tab-login');
      const tabCadastro = document.getElementById('tab-cadastro');
      
      // Add fade out animation
      if (tab === 'login') {
        cadastroForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
      } else {
        loginForm.classList.add('hidden');
        cadastroForm.classList.remove('hidden');
      }
      
      // Update tab indicators
      tabLogin.classList.toggle('active', tab === 'login');
      tabCadastro.classList.toggle('active', tab === 'cadastro');
    }

    // --- Login ---
    async function handleLogin(e) {
      e.preventDefault();
      const matricula = document.getElementById('login-matricula').value.trim();
      const senha = document.getElementById('login-senha').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Entrando...';

      const result = await Auth.loginPorMatricula(matricula, senha);

      if (result.success) {
        Utils.showToast('Login realizado com sucesso!', 'success');
        const perfil = await Auth.getPerfil();
        setTimeout(() => {
          if (perfil && perfil.role === 'professor') {
            Utils.redirect('professor/index.html');
          } else {
            Utils.redirect('aluno/index.html');
          }
        }, 500);
      } else {
        Utils.showToast(result.error, 'error');
        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Entrar`;
      }
    }

    // --- Cadastro ---
    async function handleCadastro(e) {
      e.preventDefault();
      const nome = document.getElementById('cad-nome').value.trim();
      const matricula = document.getElementById('cad-matricula').value.trim();
      const email = document.getElementById('cad-email').value.trim();
      const senha = document.getElementById('cad-senha').value;
      const senha2 = document.getElementById('cad-senha2').value;
      const btn = document.getElementById('btn-cadastro');

      if (senha !== senha2) {
        Utils.showToast('As senhas não coincidem.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-sm"></div> Cadastrando...';

      const result = await Auth.cadastrar(email, senha, nome, matricula);

      if (result.success) {
        Utils.showToast('Cadastro realizado! Fazendo login...', 'success');
        // Auto-login após cadastro
        const loginResult = await Auth.login(email, senha);
        if (loginResult.success) {
          const perfil = await Auth.getPerfil();
          setTimeout(() => {
            if (perfil && perfil.role === 'professor') {
              Utils.redirect('professor/index.html');
            } else {
              Utils.redirect('aluno/index.html');
            }
          }, 500);
        } else {
          Utils.showToast('Cadastro feito! Faça login manualmente.', 'info');
          showTab('login');
        }
      } else {
        Utils.showToast(result.error, 'error');
      }

      btn.disabled = false;
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Criar Conta`;
    }

    // --- Utilitários de Formulário ---

    /** Alterna visibilidade de campo de senha */
    function toggleSenha(inputId, btn) {
      const input = document.getElementById(inputId);
      const eyeIcon = btn.querySelector('.icon-eye');
      const eyeOffIcon = btn.querySelector('.icon-eye-off');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.style.display = 'none';
        eyeOffIcon.style.display = '';
      } else {
        input.type = 'password';
        eyeIcon.style.display = '';
        eyeOffIcon.style.display = 'none';
      }
    }

    /** Atualiza indicador de força da senha */
    function atualizarForcaSenha(valor) {
      const textoEl = document.getElementById('senha-forca-texto');
      if (!textoEl) return;
      const bars = [1, 2, 3, 4].map(n => document.getElementById('psbar-' + n));

      let score = 0;
      if (valor.length >= 6) score++;
      if (valor.length >= 10) score++;
      if (/[A-Z]/.test(valor) && /[a-z]/.test(valor)) score++;
      if (/[0-9]/.test(valor) && /[^A-Za-z0-9]/.test(valor)) score++;

      const labels = ['', 'Fraca', 'Razoável', 'Boa', 'Forte'];
      const barClass = ['', 'psbar-weak', 'psbar-fair', 'psbar-good', 'psbar-strong'];
      const textColor = ['', 'var(--danger)', 'var(--warning)', 'var(--info)', 'var(--success)'];

      textoEl.textContent = valor.length === 0 ? '—' : (labels[score] || 'Fraca');
      textoEl.style.color = valor.length === 0 ? '' : (textColor[score] || 'var(--danger)');

      bars.forEach((bar, i) => {
        if (!bar) return;
        bar.className = 'password-strength-bar';
        if (i < score && valor.length > 0) bar.classList.add(barClass[score]);
      });

      // Revalidar confirmação se já preenchida
      const conf = document.getElementById('cad-senha2');
      if (conf && conf.value) validarConfirmacaoSenha();
    }

    /** Valida confirmação de senha em tempo real */
    function validarConfirmacaoSenha() {
      const senha = document.getElementById('cad-senha')?.value || '';
      const conf  = document.getElementById('cad-senha2')?.value || '';
      const input = document.getElementById('cad-senha2');
      const feedback = document.getElementById('cad-senha2-feedback');
      const feedIcon = document.getElementById('cad-senha2-feedback-icon');
      const feedText = document.getElementById('cad-senha2-feedback-texto');

      if (!conf) {
        if (input) { input.classList.remove('error', 'success'); }
        if (feedback) feedback.style.display = 'none';
        return;
      }

      if (senha === conf) {
        input?.classList.remove('error');
        input?.classList.add('success');
        if (feedback) {
          feedback.style.display = 'flex';
          feedback.className = 'confirm-senha-feedback confirm-senha-ok';
          feedIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
          feedText.textContent = 'Senhas coincidem';
        }
      } else {
        input?.classList.remove('success');
        input?.classList.add('error');
        if (feedback) {
          feedback.style.display = 'flex';
          feedback.className = 'confirm-senha-feedback confirm-senha-err';
          feedIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
          feedText.textContent = 'As senhas não coincidem';
        }
      }
    }

    // Verificar se chegou via QR code (token na URL)
    const qrToken = Utils.getQueryParam('token');
    const qrSlug = Utils.getQueryParam('s');
    if (qrToken) {
      // Guardar token para uso após login
      sessionStorage.setItem('qr_token', qrToken);
    }
    if (qrSlug) {
      // Guardar slug curto para uso após login
      sessionStorage.setItem('qr_slug', qrSlug);
    }

    // Registrar Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
    }
  </script>
</body>
</html>
